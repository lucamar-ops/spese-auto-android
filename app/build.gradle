plugins {
    id 'com.android.application'
}

android {
    namespace 'it.luca.speseauto'
    compileSdk 35

    defaultConfig {
        applicationId "it.luca.speseauto"
        minSdk 24
        targetSdk 34
        versionCode 11
        versionName "11.0"
    }

    // Chiave fissa: così ogni nuova versione si installa sopra la vecchia senza perdere i dati
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
