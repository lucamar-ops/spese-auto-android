name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compila APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk SpeseAuto.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SpeseAuto
          path: SpeseAuto.apk

      - name: Pubblica in Releases (download diretto dal telefono)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Spese Auto build ${{ github.run_number }}
          files: SpeseAuto.apk
